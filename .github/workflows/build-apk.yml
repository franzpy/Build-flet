name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'pyproject.toml'
      - 'android_res/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=1.1.2" "flet-video>=1.1.2" "flet-notifications>=1.1.2" "yt-dlp>=2026.1.1"

      - name: Build APK
        run: flet build apk --arch arm64-v8a --skip-flutter-doctor --yes -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-catalog-apk
          path: build/apk/*.apk
          if-no-files-found: error
