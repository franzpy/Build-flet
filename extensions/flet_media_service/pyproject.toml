[project]
name = "flet-media-service"
version = "0.1.0"
description = "Servicio de reproducción multimedia en segundo plano para Flet"
requires-python = ">=3.10"
dependencies = ["flet>=1.1.2"]

[tool.setuptools.package-data]
"flutter.flet_media_service" = [
    "pubspec.yaml",
    "flet-extension.toml",
    "lib/**",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
